<button
  type="button"
  class="scroll-top-btn"
  [class.visible]="isVisible()"
  (click)="scrollToTop()"
  aria-label="Volver arriba del todo">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
    <path d="m18 15-6-6-6 6"/>
  </svg>
</button>
