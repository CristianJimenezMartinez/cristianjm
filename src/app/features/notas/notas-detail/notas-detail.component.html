<div class="nota-detail-container section">
  <div class="container">
    <a routerLink="/notas-tecnicas" class="back-link">
      &larr; Volver a Notas Técnicas
    </a>

    <header class="nota-header" *ngIf="notaMeta()">
      <div class="meta-row">
        <span class="nota-date">{{ notaMeta()?.date | date:'dd/MM/yyyy' }}</span>
        <div class="tags">
          <span *ngFor="let tag of notaMeta()?.tags" class="tag">#{{ tag }}</span>
        </div>
      </div>
    </header>

    <div class="markdown-body solid-card">
      <markdown [data]="notaContent()"></markdown>
    </div>
  </div>
</div>
